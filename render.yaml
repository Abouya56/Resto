# Démonstration gratuite sur Render (voir deploy/GUIDE-DEMO-RENDER.md).
# Base gratuite supprimée après ~30 jours, site endormi après 15 min sans visite : à n'utiliser que pour montrer.
databases:
  - name: resto-db
    plan: free
    databaseName: resto
    user: resto

services:
  - type: web
    name: resto-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: sh /app/render-start.sh
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.render
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: resto-db
          property: connectionString
