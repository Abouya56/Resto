{% extends "base.html" %}
{% block title %}Adresses{% endblock %}
{% block content %}
<h1 class="h3">Adresses</h1>
<a class="btn btn-warning mb-3" href="{% url 'users:address_create' %}">Nouvelle adresse</a>
{% for address in addresses %}
    <div class="card resto-card card-body mb-2">
        <strong>{{ address.label }}</strong>
        <p>{{ address.line1 }}, {{ address.city }}</p>
    </div>
{% endfor %}
{% endblock %}
