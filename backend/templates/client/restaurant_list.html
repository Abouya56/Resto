{% extends "base.html" %}
{% block title %}Restaurants{% endblock %}
{% block content %}
<p class="landing-kicker">À commander</p>
<h1 class="landing-section-title mb-3">Restaurants ouverts</h1>
<form class="row g-2 mb-4" method="get">
    <div class="col-md-5"><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="Nom du restaurant"></div>
    <div class="col-md-4"><input class="form-control" name="city" value="{{ request.GET.city }}" placeholder="Ville"></div>
    <div class="col-md-3"><button class="btn btn-resto w-100">Rechercher</button></div>
</form>
<div class="row g-4">
    {% for restaurant in restaurants %}
        <div class="col-md-6 col-xl-4">
            {% include "components/restaurant_card.html" %}
        </div>
    {% empty %}
        <p>Aucun restaurant ne correspond à votre recherche.</p>
    {% endfor %}
</div>
{% endblock %}
