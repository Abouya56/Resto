{% extends "base.html" %}
{% block title %}Profil{% endblock %}
{% block content %}
<div class="form-page mx-auto">
    <header class="form-page-head">
        <h1 class="h3 mb-1">Mon profil</h1>
        <p class="text-muted mb-0">Vos informations de contact.</p>
    </header>
    <form method="post" novalidate>
        {% csrf_token %}
        <section class="form-section">{% include "components/form_fields.html" %}</section>
        <div class="form-actions"><button class="btn btn-resto btn-lg">Enregistrer</button></div>
    </form>
</div>
{% endblock %}
