{% extends "base.html" %}
{% block title %}Mot de passe oublié{% endblock %}
{% block content %}
<div class="col-md-5 mx-auto">
    <h1 class="h4 mb-3">Réinitialiser le mot de passe</h1>
    <form method="post" class="card resto-card card-body">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-dark">Envoyer</button>
    </form>
</div>
{% endblock %}
