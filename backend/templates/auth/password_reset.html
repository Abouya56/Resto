{% extends "base.html" %}
{% block title %}Mot de passe oublié{% endblock %}
{% block content %}
<div class="login">
    <div class="login-card">
        <span class="login-mark"><i class="bi bi-key"></i></span>
        <h1>Mot de passe oublié</h1>
        <p class="login-sub">Entrez votre e-mail : on vous envoie un lien pour en choisir un nouveau.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">{% include "components/form_fields.html" %}</div>
            <button class="btn btn-resto btn-lg w-100">Envoyer le lien</button>
            <p class="login-forgot"><a href="{% url 'users:login' %}">Retour à la connexion</a></p>
        </form>
    </div>
</div>
{% endblock %}
