{% extends "base.html" %}
{% block title %}E-mail envoyé{% endblock %}
{% block content %}
<div class="login">
    <div class="login-card">
        <span class="login-mark"><i class="bi bi-envelope-check"></i></span>
        <h1>Regardez vos e-mails</h1>
        <p class="login-sub">Si un compte existe avec cette adresse, un lien vient d'être envoyé.</p>
        <a class="btn btn-resto btn-lg w-100" href="{% url 'users:login' %}">Retour à la connexion</a>
    </div>
</div>
{% endblock %}
