{% with brand=restaurant|default:current_restaurant %}
    {% if brand %}
        {% include "components/restaurant_logo.html" with restaurant=brand cls="navbar-logo" %}
        <span class="navbar-brand-name">{{ brand.name }}</span>
    {% elif site_logo_url %}
        <img class="navbar-logo navbar-logo-site" src="{{ site_logo_url }}" alt="">
        <span class="navbar-brand-name">{{ site_name }}</span>
    {% else %}
        {{ site_name }}
    {% endif %}
{% endwith %}
