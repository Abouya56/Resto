<ol class="order-steps">
    <li class="{% if step == 1 %}is-current{% elif step > 1 %}is-done{% endif %}"><span>1</span> Plats</li>

    <li class="{% if step == 3 %}is-current{% endif %}"><span>3</span> Suivi</li>
</ol>
